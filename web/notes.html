<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace notes</title><script src="/view-client.js"></script><style>body{margin:0;padding:38px;font:16px -apple-system,sans-serif;color:#253043;background:#f5f6f8}main{max-width:760px;margin:auto}h1{font-size:27px;margin-bottom:12px}p{line-height:1.7;color:#637083}textarea{width:100%;height:260px;box-sizing:border-box;border:1px solid #c9d0da;border-radius:10px;background:white;padding:18px;font:16px -apple-system,sans-serif;line-height:1.6}button{margin-top:16px;padding:11px 20px;background:#253043;color:white;border:0;border-radius:8px;font:15px -apple-system,sans-serif;cursor:pointer}#status{font-size:13px;margin-left:13px}code{font-size:13px}</style></head><body><main><h1>Workspace notes</h1><p>A starter HTML view for this repo. Write a note and save it; it will be here when you return. This view uses the shared JSON helper without changing the repo’s files.</p><textarea id="notes" aria-label="Workspace notes" disabled placeholder="What are you working on?"></textarea><button id="save" disabled>Save notes</button><span id="status" role="status">Loading…</span><p><small>Stored through <code>RepoHub.saveJSON('notes', value)</code>.</small></p></main><script>const notes=document.getElementById('notes'),status=document.getElementById('status'),save=document.getElementById('save');RepoHub.getJSON('notes').then(value=>{notes.value=value?.text||'';notes.disabled=false;save.disabled=false;status.textContent=value?'Loaded your saved note.':'Ready.';}).catch(e=>status.textContent=e.message);save.onclick=async()=>{save.disabled=true;try{await RepoHub.saveJSON('notes',{text:notes.value,savedAt:new Date().toISOString()});status.textContent='Saved on this Mac.';}catch(e){status.textContent=e.message;}finally{save.disabled=false;}};</script></body></html>
