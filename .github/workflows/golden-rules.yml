name: Golden rules
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automated-contract:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run RepoHub's golden rules
        run: python3 tools/release_gate.py --require-clean --output "$RUNNER_TEMP/repohub-golden-rules.json"
      - name: Explain failed synthetic checks
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'repohub-golden-rules.json'
          if not path.exists():
              raise SystemExit('No gate receipt was created')
          report = json.loads(path.read_text())
          print('Gate error:', report.get('gate_error', 'none'))
          print('Source unchanged:', report.get('source_unchanged'))
          python = report.get('python', {})
          if not python.get('successful') or python.get('skipped'):
              print(Path(python['log']).read_text())
          for check in report.get('commands', []):
              if check['result'] != 'passed':
                  print(check['check'], check['returncode'])
                  print(Path(check['log']).read_text())
          for rule in report.get('rules', []):
              if rule['result'] != 'passed':
                  print(rule['id'], rule['tests'])
          PYTHON
